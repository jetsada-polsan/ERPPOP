name: Import BPlus barcodes

# preview = เทียบอย่างเดียว ไม่บันทึก, apply = backup ก่อนแล้วเพิ่มเฉพาะบาร์โค้ดที่ ERP ยังไม่มี
# ไฟล์ data/bplus-barcodes-2026.csv ขึ้นเซิร์ฟเวอร์พร้อม deploy (สร้างด้วย scripts/bplus-barcode-export.py)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: preview or apply
        required: true
        type: choice
        options: [preview, apply]
        default: preview

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Run on the server
        env:
          MODE: ${{ inputs.mode }}
        run: |
          ARGS="data/bplus-barcodes-2026.csv --report=storage/app/bplus-barcodes-report.csv"
          if [ "$MODE" = apply ]; then
            CMD="php artisan erp:backup && php artisan erp:import-bplus-barcodes $ARGS --apply"
          else
            CMD="php artisan erp:import-bplus-barcodes $ARGS && echo && head -n 60 storage/app/bplus-barcodes-report.csv"
          fi
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "cd '${{ vars.APP_DIR }}' && $CMD"
