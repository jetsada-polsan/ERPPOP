name: Classify barcodes

# preview = แสดงยอดอย่างเดียว ไม่บันทึก, apply = backup ก่อนแล้วจัดประเภทจริง
# แตะเฉพาะแถว CUSTOM เปลี่ยนแค่ป้ายประเภท ไม่แก้เลขบาร์โค้ด SKU ราคา หรือหน่วย
on:
  workflow_dispatch:
    inputs:
      mode:
        description: preview or apply
        required: true
        type: choice
        options: [preview, apply, report, legacy, before]
        default: preview

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Run on the server
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = apply ]; then
            CMD="php artisan erp:backup && php artisan erp:classify-barcodes --apply --report=storage/app/barcode-classify.csv"
          elif [ "$MODE" = report ]; then
            # อ่านอย่างเดียว: รายงานของรอบล่าสุด
            CMD="wc -l storage/app/barcode-classify.csv && head -n 80 storage/app/barcode-classify.csv"
          else
            CMD="php artisan erp:classify-barcodes --report=storage/app/barcode-classify.csv && head -n 40 storage/app/barcode-classify.csv"
          fi
          if [ "$MODE" = before ]; then
            # อ่านอย่างเดียว: ประเภทของแถว LEGACY ตอนนี้ ใน backup ที่สำรองไว้ก่อนบันทึก
            ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "cd '${{ vars.APP_DIR }}' && bash -s" <<'SH'
          set -e
          f=storage/app/backups/erp-db-20261102-163031.sql.gz
          ls -la "$f"
          zcat "$f" | awk '/^COPY public.product_barcodes /{print; on=1; next} on && $0=="\\."{exit} on' > /tmp/pb-before.tsv
          head -1 /tmp/pb-before.tsv
          echo "rows in backup: $(($(wc -l < /tmp/pb-before.tsv) - 1))"
          php artisan tinker --execute="echo DB::table('product_barcodes')->where('barcode_type','LEGACY')->pluck('id')->implode(PHP_EOL);" > /tmp/pb-legacy-ids.txt
          echo "legacy now: $(wc -l < /tmp/pb-legacy-ids.txt)"
          col=$(head -1 /tmp/pb-before.tsv | sed 's/.*(//; s/).*//' | tr ',' '\n' | sed 's/ //g' | grep -n '^barcode_type$' | cut -d: -f1)
          echo "barcode_type column: $col"
          echo "types before of rows that are LEGACY now:"
          tail -n +2 /tmp/pb-before.tsv | awk -F'\t' -v c="$col" 'NR==FNR{ids[$1]=1; next} ($1 in ids){print $c}' /tmp/pb-legacy-ids.txt - | sort | uniq -c
          echo "all types in backup:"
          tail -n +2 /tmp/pb-before.tsv | awk -F'\t' -v c="$col" '{print $c}' | sort | uniq -c
          rm -f /tmp/pb-before.tsv /tmp/pb-legacy-ids.txt
          SH
            exit 0
          fi
          if [ "$MODE" = legacy ]; then
            # อ่านอย่างเดียว: บาร์โค้ดที่เป็น LEGACY พร้อม SKU ชื่อสินค้า และวันที่
            ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "cd '${{ vars.APP_DIR }}' && php artisan tinker" <<'PHP'
          $rows = DB::table('product_barcodes as b')->join('products as p', 'p.id', '=', 'b.product_id')->where('b.barcode_type', 'LEGACY')->orderBy('b.id')->get(['b.id', 'b.barcode', 'p.sku_code', 'p.name_th', 'b.source', 'b.created_at', 'b.updated_at']);
          echo 'LEGACY rows: '.$rows->count().PHP_EOL;
          foreach ($rows as $r) { echo implode(' | ', [$r->id, $r->barcode, $r->sku_code, $r->name_th, $r->source, $r->created_at, $r->updated_at]).PHP_EOL; }
          PHP
            exit 0
          fi
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "cd '${{ vars.APP_DIR }}' && $CMD"
