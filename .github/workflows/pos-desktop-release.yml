name: Build POPSTAR POS

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in 1.2.3 format
        required: true
        type: string
      notes:
        description: Release notes shown to cashiers
        required: true
        type: string
      mandatory:
        description: Require this update before selling
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # ด่านแรกก่อนสร้างตัวติดตั้ง — เดิมงาน build ไม่ได้ผูกกับเทสต์เลย
  # สั่ง release ได้แม้ชุดเทสต์แดง แล้วตัวติดตั้งจะไปถึงเครื่องหน้าร้านทันที
  # เพราะ publish เขียนทับ latest.json ที่ทุกเครื่องอ่านเพื่อเช็คอัปเดต
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pos-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/pos-desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production web build
        run: pnpm build

  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/pos-desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/pos-desktop/src-tauri
      - name: Set version and updater public key
        env:
          VERSION: ${{ inputs.version }}
          UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/configure-release.mjs
        working-directory: apps/pos-desktop
      - run: pnpm install --frozen-lockfile
        working-directory: apps/pos-desktop
      - name: Build signed installers
        run: pnpm tauri build
        working-directory: apps/pos-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: POPSTAR-POS-${{ inputs.version }}
          path: |
            apps/pos-desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error

      - name: Prepare signed update package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          MANDATORY: ${{ inputs.mandatory }}
          APP_URL: http://27.254.143.219
        run: |
          $bundle = 'apps/pos-desktop/src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem -Path $bundle -Filter '*.exe' | Select-Object -First 1
          $signature = Get-ChildItem -Path $bundle -Filter '*.exe.sig' | Select-Object -First 1
          if ($null -eq $installer -or $null -eq $signature) { throw 'Missing signed Windows installer or .sig file' }

          New-Item -ItemType Directory -Force -Path release | Out-Null
          $name = "POPSTAR-POS-$env:VERSION.exe"
          Copy-Item $installer.FullName "release/$name"
          $signatureText = (Get-Content $signature.FullName -Raw).Trim()
          $manifest = @{
            version = $env:VERSION
            notes = $env:NOTES
            pub_date = [DateTime]::UtcNow.ToString('o')
            platforms = @{ 'windows-x86_64' = @{ signature = $signatureText; url = "$env:APP_URL/download/pos/releases/$name" } }
            mandatory = [System.Convert]::ToBoolean($env:MANDATORY)
            sha256 = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path release/latest.json -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: POPSTAR-POS-release-${{ inputs.version }}
          path: release/
          if-no-files-found: error

  publish:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: POPSTAR-POS-release-${{ inputs.version }}
          path: release
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.POS_RELEASE_SSH_KEY }}
      - run: ssh-keyscan -H "${{ secrets.POS_RELEASE_HOST }}" >> ~/.ssh/known_hosts
      - name: Publish signed POS update to ERP
        env:
          POS_RELEASE_HOST: ${{ secrets.POS_RELEASE_HOST }}
          POS_RELEASE_USER: ${{ secrets.POS_RELEASE_USER }}
        run: |
          cat > release.sftp <<'EOF'
          put release/POPSTAR-POS-${{ inputs.version }}.exe
          put release/latest.json latest.next.json
          rename latest.next.json latest.json
          EOF
          sftp -b release.sftp "$POS_RELEASE_USER@$POS_RELEASE_HOST"
