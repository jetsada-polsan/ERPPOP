name: PostgreSQL UAT

# ชุดเทสต์ปกติรันบน SQLite ซึ่งเร็วแต่มองไม่เห็นพฤติกรรมเฉพาะของ PostgreSQL
# workflow นี้รันของเดียวกันกับ PostgreSQL จริง แล้วปิดท้ายด้วยการยิงงานพร้อมกัน
# ซึ่งเป็นวิธีเดียวที่จับบั๊กเลขเอกสารชนกันได้ — บั๊กนั้นผ่านทุกเทสต์บน SQLite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  postgres-uat:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jeterp_test
          POSTGRES_USER: jeterp
          POSTGRES_PASSWORD: jeterp
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql, zip, bcmath, pcntl
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: เตรียม .env สำหรับ CI
        run: |
          cp .env.example .env
          php artisan key:generate
          {
            echo "APP_ENV=testing"
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=jeterp_test"
            echo "DB_USERNAME=jeterp"
            echo "DB_PASSWORD=jeterp"
          } >> .env

      # เรียก phpunit ตรง ๆ ไม่ผ่าน artisan test เพราะ artisan test คืน exit code 1
      # ทุกครั้งที่ส่ง --configuration มาให้ ต่อให้เทสต์ผ่านหมด งานนี้จึงแดงมาตลอด
      # ทั้งที่ชุดเทสต์เขียว
      - name: ชุดเทสต์ทั้งหมดบน PostgreSQL
        run: ./vendor/bin/phpunit --configuration=phpunit.pgsql.xml

      - name: เตรียมฐานสำหรับทดสอบการยิงพร้อมกัน
        run: |
          php artisan migrate:fresh --force
          php artisan tinker --execute="
            DB::table('document_types')->insertOrIgnore(['code' => 'CASH_SALE', 'name_th' => 'ใบขายสด']);
            DB::table('branches')->insertOrIgnore(['code' => 'CI', 'name_th' => 'สาขา CI', 'is_active' => true]);
          "

      # โหมด number ขอเลขอย่างเดียว เอกสารที่ได้จึงเป็นใบเปล่าไม่มีรายการและไม่มี GL
      # ซึ่งถูกต้องสำหรับการพิสูจน์ว่าเลขไม่ซ้ำ แต่ห้ามเอาไปกระทบยอดต่อ
      - name: ยิงพร้อมกัน 30 process — เลขเอกสารต้องไม่ซ้ำและต้องไม่มี error
        run: |
          BRANCH=$(php artisan tinker --execute="echo DB::table('branches')->where('code','CI')->value('id');" | tail -1 | tr -dc '0-9')
          php artisan uat:concurrency --users=30 --per-user=5 --branch="$BRANCH" --confirm-test-database

      # ล้างใบเปล่าจากรอบบน แล้วสร้างชุดข้อมูลที่ขายได้จริง เพื่อให้การกระทบยอด
      # มีของให้เทียบ ไม่ใช่เทียบศูนย์กับศูนย์แล้วผ่านไปเฉย ๆ
      - name: เตรียมข้อมูลสำหรับขายจริงทั้งวงจร
        run: |
          php artisan migrate:fresh --force
          php artisan tinker --execute='require "tools/staging/seed_uat_data.php";'

      - name: ยิงพร้อมกัน 30 process — ขายจริงทั้งวงจร ตัดสต๊อกและลง GL
        run: |
          BRANCH=$(php artisan tinker --execute="echo DB::table('branches')->where('code','UAT')->value('id');" | tail -1 | tr -dc '0-9')
          php artisan uat:concurrency --users=30 --per-user=5 --branch="$BRANCH" --mode=sale --confirm-test-database

      - name: ตรวจฐานต้นทุนก่อนกระทบยอด
        run: |
          php artisan tinker --execute="
            \$ids = DB::table('products')->where('sku_code','like','UAT-%')->pluck('id');
            printf('สินค้า UAT (query builder)=%d · ที่ Eloquent มองเห็น=%d'.PHP_EOL,
              \$ids->count(), App\Models\Product::whereIn('id', \$ids)->count());
            printf('lots=%d (คิดต้นทุน 0 = %d) · balances=%d'.PHP_EOL,
              DB::table('stock_lots')->count(),
              DB::table('stock_lots')->where('unit_cost', 0)->count(),
              DB::table('stock_balances')->count());
            printf('movement มี lot=%d · ไม่มี lot=%d'.PHP_EOL,
              DB::table('stock_movements')->whereNotNull('stock_lot_id')->count(),
              DB::table('stock_movements')->whereNull('stock_lot_id')->count());
            printf('บรรทัดขาย=%d · ต้นทุน>0=%d · รวมต้นทุน=%s'.PHP_EOL,
              DB::table('stock_document_items')->count(),
              DB::table('stock_document_items')->where('cost_amount','>',0)->count(),
              DB::table('stock_document_items')->sum('cost_amount'));
            printf('fillable ของ StockDocumentItem มี cost_amount=%s'.PHP_EOL,
              in_array('cost_amount', (new App\Models\StockDocumentItem)->getFillable(), true) ? 'มี' : 'ไม่มี');
          "

      - name: กระทบยอด stock / COGS / GL / sales_postings
        run: php artisan uat:reconcile
