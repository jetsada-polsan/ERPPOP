name: Void POS test sales

# ยกเลิกบิล POS ที่ขายทดสอบก่อนเปิดร้าน แบบเดียวกับปุ่มยกเลิกบิล (คืนสต็อก กลับรายการบัญชี)
# preview = แสดงรายการอย่างเดียว, apply = backup ก่อนแล้วยกเลิกจริง
on:
  workflow_dispatch:
    inputs:
      mode:
        description: preview or apply
        required: true
        type: choice
        options: [preview, apply]
        default: preview
      before:
        description: ยกเลิกบิลที่ขายก่อนวันนี้ (YYYY-MM-DD)
        required: true
        default: '2026-11-05'
      branches:
        description: รหัสสาขาคั่นด้วยช่องว่าง
        required: true
        default: 'B001 HQ'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      # Trust only the server host key stored in the DEPLOY_KNOWN_HOSTS secret.
      # ssh-keyscan at run time would trust whatever key answers (no MITM protection).
      - name: Trust the pinned server host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Secret DEPLOY_KNOWN_HOSTS is not set. Add the server's known_hosts line(s) (see docs/OPERATIONS.md)."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::DEPLOY_KNOWN_HOSTS has no entry for DEPLOY_HOST. The host name/IP in the known_hosts line must match DEPLOY_HOST exactly."
            exit 1
          fi
          printf 'Host *\n  StrictHostKeyChecking yes\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Run on the server
        env:
          MODE: ${{ inputs.mode }}
          BEFORE: ${{ inputs.before }}
          BRANCHES: ${{ inputs.branches }}
        run: |
          [[ "$BEFORE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "before ต้องเป็น YYYY-MM-DD"; exit 1; }
          ARGS="--before=$BEFORE"
          for code in $BRANCHES; do
            [[ "$code" =~ ^[A-Za-z0-9]+$ ]] || { echo "รหัสสาขาไม่ถูกต้อง: $code"; exit 1; }
            ARGS="$ARGS --branch=$code"
          done
          if [ "$MODE" = apply ]; then
            CMD="php artisan erp:backup && php artisan erp:void-pos-test-sales $ARGS --apply"
          else
            CMD="php artisan erp:void-pos-test-sales $ARGS"
          fi
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "cd '${{ vars.APP_DIR }}' && $CMD"
