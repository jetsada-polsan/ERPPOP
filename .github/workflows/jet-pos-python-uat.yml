name: Build JET POS Python UAT

on:
  workflow_dispatch:
    inputs:
      version:
        description: UAT version shown in the installer artifact
        required: true
        default: 0.1.0

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/jet-pos-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python POS dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Run isolated UAT core tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows executable
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name "JET-POS-Python-UAT-${{ inputs.version }}"
          --paths . main.py
      - name: Upload separate Python POS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JET-POS-Python-UAT-${{ inputs.version }}-windows
          path: apps/jet-pos-python/dist/JET-POS-Python-UAT-${{ inputs.version }}/**
          if-no-files-found: error

