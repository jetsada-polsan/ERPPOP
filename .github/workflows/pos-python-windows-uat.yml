name: Build PopCentral POS UAT for Windows
run-name: POS Python ${{ inputs.version || 'dev' }} · ${{ inputs.build_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: UAT version, e.g. 0.1.0
        required: true
        default: 0.1.0
        type: string
      publish:
        description: Publish installer to ERP /download/python-pos
        required: false
        default: false
        type: boolean
      build_id:
        description: Build correlation ID from PopCentral ERP
        required: false
        default: manual
        type: string
      source_ref:
        description: Branch, tag, or commit containing the POS source
        required: false
        default: main
        type: string
  push:
    paths:
      - apps/pos-python/**
      - .github/workflows/pos-python-windows-uat.yml

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/pos-python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/pos-python/requirements-build.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-build.txt
      - name: Run core and scale tests
        run: python -m unittest discover -s tests -v
      - name: Stamp application version
        shell: pwsh
        env:
          UAT_VERSION: ${{ inputs.version || '0.1.0-dev' }}
        run: |
          if ($env:UAT_VERSION -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "UAT_VERSION ไม่ถูกต้อง: $env:UAT_VERSION"
          }
          $versionPath = Join-Path $PWD 'pos_python/build_info.py'
          $content = "APP_VERSION = `"$env:UAT_VERSION`"`r`n"
          [System.IO.File]::WriteAllText(
            $versionPath,
            $content,
            [System.Text.UTF8Encoding]::new($false)
          )
          $pythonFiles = @('main.py') + @(Get-ChildItem -File 'pos_python\*.py' | ForEach-Object FullName)
          python -m py_compile @pythonFiles
      - name: Build Windows application
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name PopCentral-POS
          --collect-all PySide6
          main.py
      - name: Smoke test packaged application
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\PopCentral-POS\PopCentral-POS.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "ไม่พบไฟล์ executable ที่ build: $exe"
          }
          $process = Start-Process -FilePath $exe -ArgumentList '--self-check' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "ตัว executable เปิดโหมด self-check ไม่ผ่าน, exit code $($process.ExitCode)"
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build UAT installer
        shell: pwsh
        env:
          UAT_VERSION: ${{ inputs.version || '0.1.0-dev' }}
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:UAT_VERSION" installer\PopCentral-POS.iss'
      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -File 'dist-installer\PopCentral-POS-UAT-*-setup.exe')
          if ($installers.Count -ne 1) {
            throw "ต้องมี installer 1 ไฟล์ แต่พบ $($installers.Count) ไฟล์"
          }
          $installer = $installers[0]
          if ($installer.Length -lt 10MB) {
            throw "installer มีขนาดผิดปกติ: $($installer.Length) ไบต์"
          }
          $stream = [System.IO.File]::OpenRead($installer.FullName)
          try {
            $first = $stream.ReadByte()
            $second = $stream.ReadByte()
          } finally {
            $stream.Dispose()
          }
          if ($first -ne 0x4D -or $second -ne 0x5A) {
            throw "installer ไม่ใช่ Windows executable (MZ)"
          }
          Write-Host "Installer ผ่านการตรวจสอบ: $($installer.Name), $($installer.Length) ไบต์"
      - uses: actions/upload-artifact@v4
        with:
          name: PopCentral-POS-UAT-${{ inputs.version || '0.1.0-dev' }}
          path: apps/pos-python/dist-installer/*.exe
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: test-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PopCentral-POS-UAT-${{ inputs.version }}
          path: release
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.POS_RELEASE_SSH_KEY }}
      - run: ssh-keyscan -H "${{ secrets.POS_RELEASE_HOST }}" >> ~/.ssh/known_hosts
      - name: Publish Python POS installer to ERP
        env:
          POS_RELEASE_USER: ${{ secrets.POS_RELEASE_USER }}
          POS_RELEASE_HOST: ${{ secrets.POS_RELEASE_HOST }}
          # Production redirects/serves the named HTTPS vhost; the raw IP on
          # port 80 intentionally returns 404, so validate the public URL.
          BASE_URL: https://popstarcenter.com
        run: |
          installer="$(find release -type f -name '*.exe' -print -quit)"
          if [ -z "$installer" ]; then
            echo "No installer artifact found" >&2
            exit 1
          fi
          target="PopCentral-POS-UAT-${{ inputs.version }}-setup.exe"
          if [ "$installer" != "release/$target" ]; then
            mv "$installer" "release/$target"
          fi
          local_bytes="$(wc -c < "release/$target" | tr -d ' ')"
          remote_tmp=".${target}.next-${GITHUB_RUN_ID}"
          # POS_RELEASE_USER is SFTP-only and starts in pos-releases. The
          # Python installer folder is its sibling; upload before switching.
          sftp -q -b - "$POS_RELEASE_USER@$POS_RELEASE_HOST" > sftp-publish.log <<SFTP
          cd ../pos-python-releases
          put release/$target $remote_tmp
          ls -l $remote_tmp
          -rm ${target}.previous.exe
          -rename $target ${target}.previous.exe
          rename $remote_tmp $target
          ls -l $target
          SFTP
          cat sftp-publish.log
          if ! awk -v bytes="$local_bytes" '$5 == bytes { found=1 } END { exit found ? 0 : 1 }' sftp-publish.log; then
            echo "SFTP อัปโหลดไม่ครบ ขนาดไฟล์บนปลายทางไม่ตรงกับ local" >&2
            exit 1
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' -I "$BASE_URL/download/python-pos" || true)"
          echo "GET /download/python-pos -> $code"
          [ "$code" = "200" ] || [ "$code" = "302" ]
