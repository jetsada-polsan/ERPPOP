name: Build PopCentral POS UAT for Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: UAT version, e.g. 0.1.0
        required: true
        default: 0.1.0
        type: string
      publish:
        description: Publish installer to ERP /download/python-pos
        required: false
        default: false
        type: boolean
  push:
    paths:
      - apps/pos-python/**
      - .github/workflows/pos-python-windows-uat.yml

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/pos-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/pos-python/requirements-build.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-build.txt
      - name: Run core and scale tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows application
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name PopCentral-POS
          --collect-all PySide6
          main.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build UAT installer
        shell: pwsh
        env:
          UAT_VERSION: ${{ inputs.version || '0.1.0-dev' }}
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:UAT_VERSION" installer\PopCentral-POS.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: PopCentral-POS-UAT-${{ inputs.version || '0.1.0-dev' }}
          path: apps/pos-python/dist-installer/*.exe
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: test-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PopCentral-POS-UAT-${{ inputs.version }}
          path: release
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Publish Python POS installer to ERP
        env:
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_PATH: ${{ vars.APP_DIR }}
          BASE_URL: http://${{ secrets.DEPLOY_HOST }}
        run: |
          installer="$(find release -type f -name '*.exe' -print -quit)"
          if [ -z "$installer" ]; then
            echo "No installer artifact found" >&2
            exit 1
          fi
          scripts/publish-pos-python.sh "${{ inputs.version }}" "$installer"
