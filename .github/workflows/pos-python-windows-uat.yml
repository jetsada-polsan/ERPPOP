name: Build PopCentral POS UAT for Windows
run-name: POS Python ${{ inputs.version || 'dev' }} · ${{ inputs.build_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: UAT version, e.g. 0.1.0
        required: true
        default: 0.1.0
        type: string
      publish:
        description: Publish installer to ERP /download/python-pos
        required: false
        default: false
        type: boolean
      build_id:
        description: Build correlation ID from PopCentral ERP
        required: false
        default: manual
        type: string
      source_ref:
        description: Branch, tag, or commit containing the POS source
        required: false
        default: main
        type: string
  push:
    paths:
      - apps/pos-python/**
      - .github/workflows/pos-python-windows-uat.yml

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/pos-python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/pos-python/requirements-build.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-build.txt
      - name: Run core and scale tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows application
        run: >-
          pyinstaller --noconfirm --clean --windowed
          --name PopCentral-POS
          --collect-all PySide6
          main.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build UAT installer
        shell: pwsh
        env:
          UAT_VERSION: ${{ inputs.version || '0.1.0-dev' }}
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:UAT_VERSION" installer\PopCentral-POS.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: PopCentral-POS-UAT-${{ inputs.version || '0.1.0-dev' }}
          path: apps/pos-python/dist-installer/*.exe
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: test-and-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PopCentral-POS-UAT-${{ inputs.version }}
          path: release
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.POS_RELEASE_SSH_KEY }}
      - run: ssh-keyscan -H "${{ secrets.POS_RELEASE_HOST }}" >> ~/.ssh/known_hosts
      - name: Publish Python POS installer to ERP
        env:
          SSH_USER: ${{ secrets.POS_RELEASE_USER }}
          SSH_HOST: ${{ secrets.POS_RELEASE_HOST }}
          BASE_URL: http://${{ secrets.POS_RELEASE_HOST }}
        run: |
          installer="$(find release -type f -name '*.exe' -print -quit)"
          if [ -z "$installer" ]; then
            echo "No installer artifact found" >&2
            exit 1
          fi
          target="PopCentral-POS-UAT-${{ inputs.version }}-setup.exe"
          if [ "$installer" != "release/$target" ]; then
            mv "$installer" "release/$target"
          fi
          remote_dir="/var/www/jeterp/storage/app/pos-python-releases"
          remote_tmp="/tmp/popcentral-pos-release-${GITHUB_RUN_ID}/${target}"
          ssh "$SSH_USER@$SSH_HOST" "mkdir -p '$(dirname "$remote_tmp")'"
          scp "release/$target" "$SSH_USER@$SSH_HOST:$remote_tmp"
          # The release directory belongs to www-data, while the release SSH
          # account is intentionally separate. Install through passwordless
          # sudo after uploading to a user-owned staging path.
          local_sum="$(sha256sum "release/$target" | cut -d' ' -f1)"
          ssh "$SSH_USER@$SSH_HOST" bash -s -- "$remote_dir" "$remote_tmp" "$target" "$local_sum" <<'REMOTE'
          set -euo pipefail
          release_dir="$1"; source_file="$2"; name="$3"; expected="$4"
          actual="$(sha256sum "$source_file" | cut -d' ' -f1)"
          if [[ "$actual" != "$expected" ]]; then
            echo "sha256 ไม่ตรงกัน ไฟล์เสียระหว่างส่ง — ไม่ทับของเดิม" >&2
            exit 1
          fi
          sudo -n mkdir -p "$release_dir"
          shopt -s nullglob
          for stale in "$release_dir"/*.previous.exe; do
            sudo -n rm -f "$stale"
          done
          for old in "$release_dir"/*-UAT-*-setup.exe; do
            [[ "$(basename "$old")" == "$name" ]] && continue
            sudo -n mv -f "$old" "${old%.exe}.previous.exe"
          done
          sudo -n install -o www-data -g www-data -m 0664 "$source_file" "$release_dir/$name"
          rm -f "$source_file"
          REMOTE
          code="$(curl -s -o /dev/null -w '%{http_code}' -I "$BASE_URL/download/python-pos" || true)"
          echo "GET /download/python-pos -> $code"
          [ "$code" = "200" ] || [ "$code" = "302" ]
