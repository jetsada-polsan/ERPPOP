name: Reset ERP transactions

# ล้างข้อมูลธุรกรรมทั้งระบบ (บิล POS, ใบซื้อ/ขาย, บัญชี, สต็อก, กะ, คิวออฟไลน์)
# แม่แบบ: สินค้า ลูกค้า ผู้ใช้ สิทธิ์ สาขา เครื่อง POS จะคงอยู่ไม่แตะ
# dry-run = แสดงรายการที่จะลบ, apply = backup ก่อนแล้วลบจริง
on:
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run or apply
        required: true
        type: choice
        options: [dry-run, apply]
        default: dry-run

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Run on the server
        env:
          MODE: ${{ inputs.mode }}
        run: |
          # ลบของจริงต้องมี backup สดใหม่ ก่อนรันลบจึงสั่ง backup
          if [ "$MODE" = apply ]; then
            CMD='DB=$(php artisan tinker --execute="echo DB::connection()->getDatabaseName();") && php artisan erp:backup && php artisan erp:reset-transactions --confirm-database=$DB --force'
          else
            CMD='DB=$(php artisan tinker --execute="echo DB::connection()->getDatabaseName();") && php artisan erp:reset-transactions --confirm-database=$DB --dry-run'
          fi
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "cd '${{ vars.APP_DIR }}' && $CMD"
