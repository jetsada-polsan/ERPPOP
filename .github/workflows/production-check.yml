name: Production check (backup + restore drill + usage)

# ตรวจ production โดยไม่แก้ข้อมูลจริง: backup, restore ลงฐานแยกแล้วลบทิ้ง, health, จำนวนแถวต่อโมดูล
# ผลออกเป็น annotation (::notice::) เพื่ออ่านได้จากหน้า run โดยไม่ต้องเปิด log

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      # Trust only the server host key stored in the DEPLOY_KNOWN_HOSTS secret.
      # ssh-keyscan at run time would trust whatever key answers (no MITM protection).
      - name: Trust the pinned server host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Secret DEPLOY_KNOWN_HOSTS is not set. Add the server's known_hosts line(s) (see docs/OPERATIONS.md)."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::DEPLOY_KNOWN_HOSTS has no entry for DEPLOY_HOST. The host name/IP in the known_hosts line must match DEPLOY_HOST exactly."
            exit 1
          fi
          printf 'Host *\n  StrictHostKeyChecking yes\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Run checks on the server
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "APP_DIR='${{ vars.APP_DIR }}' bash -s" < scripts/ops/production-check.sh | tee result.txt
          grep '^RESULT ' result.txt | grep -vE '^RESULT (rows|pos_|offline_|desktop_)' | sed 's/^RESULT /::notice title=check::/'
          {
            echo '### Production check'
            echo '```'
            grep '^RESULT ' result.txt | sed 's/^RESULT //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # annotation ได้ไม่เกิน 10 บรรทัดต่อ step: ตัวเลขการใช้งานแยกไว้อีก step
      - name: Usage annotations
        run: grep -E '^RESULT (rows|pos_|offline_|desktop_)' result.txt | sed 's/^RESULT /::notice title=usage::/'
