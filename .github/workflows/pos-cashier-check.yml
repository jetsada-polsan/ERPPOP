name: POS cashier check

# ตรวจว่าทำไมแคชเชียร์เข้า POS ด้วย PIN ไม่ได้ อ่านอย่างเดียว ไม่แสดง PIN
on:
  workflow_dispatch:
    inputs:
      branch:
        description: รหัสสาขา
        required: true
        default: B001

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - run: ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Run on the server
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          [[ "$BRANCH" =~ ^[A-Za-z0-9]+$ ]] || { echo "รหัสสาขาไม่ถูกต้อง"; exit 1; }
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "cd '${{ vars.APP_DIR }}' && php artisan erp:pos-cashier-check $BRANCH"
