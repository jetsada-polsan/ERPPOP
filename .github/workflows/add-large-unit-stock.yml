name: Add large unit stock

# ไม่แก้ยอดสต๊อกทันที: mode=create สร้างใบปรับสต๊อกรออนุมัติหลัง backup
on:
  workflow_dispatch:
    inputs:
      mode:
        description: preview or create
        required: true
        type: choice
        options: [preview, create]
        default: preview
      branch:
        description: Branch code of the warehouse
        required: true
        type: string
        default: HQ

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      # Trust only the server host key stored in the DEPLOY_KNOWN_HOSTS secret.
      # ssh-keyscan at run time would trust whatever key answers (no MITM protection).
      - name: Trust the pinned server host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Secret DEPLOY_KNOWN_HOSTS is not set. Add the server's known_hosts line(s) (see docs/OPERATIONS.md)."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error::DEPLOY_KNOWN_HOSTS has no entry for DEPLOY_HOST. The host name/IP in the known_hosts line must match DEPLOY_HOST exactly."
            exit 1
          fi
          printf 'Host *\n  StrictHostKeyChecking yes\n' >> ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Run on the server
        env:
          BRANCH: ${{ inputs.branch }}
          MODE: ${{ inputs.mode }}
        run: |
          case "$BRANCH" in *[!A-Za-z0-9-]*|"") echo "invalid branch"; exit 1;; esac
          if [ "$MODE" = create ]; then
            CMD="php artisan erp:backup && php artisan erp:add-large-unit-stock --branch=$BRANCH --force"
          else
            CMD="php artisan erp:add-large-unit-stock --branch=$BRANCH --dry-run"
          fi
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "cd '${{ vars.APP_DIR }}' && $CMD"
